name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 */24 * * *" # Update setiap 24 jam
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create dist folder
        run: mkdir -p dist

      # 1. Generate SNAKE
      - name: generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 2. Generate PACMAN (Menggunakan Metrics yang Benar)
      - name: generate pacman.svg
        uses: lowlighter/metrics@latest
        with:
          filename: dist/pacman-contribution-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      # 3. FIX PERMISSION
      - name: Fix permissions
        run: sudo chown -R $USER:$USER dist

      # 4. PUSH SEMUA FILE SEKALIGUS
      - name: push updates to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
