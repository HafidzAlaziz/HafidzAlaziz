name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 */24 * * *" # Update setiap 24 jam
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      # 1. Generate SNAKE
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 2. Generate PACMAN 
      - name: generate pacman-contribution-graph
        run: |
          curl -o dist/pacman-contribution-graph.svg "https://github-readme-stats-fast.vercel.app/api?username=${{ github.repository_owner }}&theme=dark"


      # 3. PUSH SEMUA FILE (Snake & Pacman) SEKALIGUS
      - name: push updates to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
